# GitLab CI/CD for the Rubia backend with three environments. Mirrors .github/workflows (ci.yml + deploy.yml).
#
#   lint     every push and merge request   PHP syntax check + composer validate
#   build    develop, staging, main         composer install --no-dev, kept as an artifact
#   deploy   by branch:
#     develop  -> dev         automatic
#     staging  -> staging     automatic
#     main     -> production  MANUAL: press the play button on the deploy:production job
#   All deploys are an FTP upload of app/ (this cPanel plan has no SSH).
#
# Set these under Settings > CI/CD > Variables, ONE SET PER ENVIRONMENT: give each variable the
# Environment scope dev, staging or production (masked; FTP_PASSWORD also protected):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR (e.g. /public_html/api/)
# Variables that today have scope "All" (the old staging values) must be changed to scope "staging",
# otherwise dev and production would try to upload to the staging server.
# Protect the main and staging branches (Settings > Repository) so only maintainers can deploy them.
# app/config/secrets.php and config/jwt-secret.php are git-ignored and never uploaded: each server keeps its own.
# Database migrations (php yii db/up --yes) are NOT run by this pipeline; see DEPLOY.md section 3.

stages:
  - lint
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

lint:php:
  stage: lint
  image: php:8.2-cli
  script:
    - |
      set -e
      find app -name '*.php' -not -path '*/vendor/*' -not -path '*/runtime/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      find libs services customer -name '*.php' -not -path '*/vendor/*' -print0 2>/dev/null | xargs -0 -r -n1 -P4 php -l > /dev/null
      echo "PHP syntax OK"

lint:composer:
  stage: lint
  image: composer:2
  script:
    - cd app
    - composer validate --no-check-publish --no-check-all || true
  allow_failure: true

build:app:
  stage: build
  image: composer:2
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(develop|staging|main)$/
  cache:
    key:
      files:
        - app/composer.lock
    paths:
      - .composer-cache/
  script:
    - cd app
    - composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs
  artifacts:
    expire_in: 1 day
    paths:
      - app/

.ftp-deploy:
  stage: deploy
  image: alpine:3.20
  needs: ["build:app"]
  before_script:
    - apk add --no-cache lftp ca-certificates
    - test -n "$FTP_SERVER" -a -n "$FTP_USERNAME" -a -n "$FTP_PASSWORD" -a -n "$FTP_SERVER_DIR" || { echo "Missing FTP_* CI/CD variables for environment $CI_ENVIRONMENT_NAME"; exit 1; }
  script:
    - |
      lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
      set ftp:ssl-allow true
      set ssl:verify-certificate no
      set net:max-retries 3
      set net:timeout 30
      mirror --reverse --only-newer --parallel=4 --verbose=1         --exclude-glob config/secrets.php         --exclude-glob config/jwt-secret.php         --exclude-glob runtime/         --exclude-glob web/assets/         --exclude-glob uploads/         --exclude-glob uploads_bkp/         --exclude-glob .git/         app/ "$FTP_SERVER_DIR"
      bye
      EOF

deploy:dev:
  extends: .ftp-deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment:
    name: dev
  resource_group: dev

deploy:staging:
  extends: .ftp-deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  environment:
    name: staging
  resource_group: staging

deploy:production:
  extends: .ftp-deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false
  environment:
    name: production
  resource_group: production
